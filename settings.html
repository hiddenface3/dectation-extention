<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Dictation Automator – Settings</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3250;
      --accent: #6c63ff;
      --accent2: #10b981;
      --text: #e8eaf6;
      --muted: #7b82a8;
      --danger: #ef4444;
      --radius: 12px;
    }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 24px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 36px;
    }

    .header-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--accent), #9c55ff);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 20px rgba(108, 99, 255, .4);
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
    }

    .header p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ── Service cards ── */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .card.chatgpt::before {
      background: linear-gradient(90deg, #10b981, #059669);
    }

    .card.grok::before {
      background: linear-gradient(90deg, #6c63ff, #9c55ff);
    }

    .card.gemini::before {
      background: linear-gradient(90deg, #3b82f6, #06b6d4);
    }

    .gemini .card-badge {
      background: rgba(59, 130, 246, .15);
    }

    /* ── Gemini Card ── */
