<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Offscreen Dictation Visualizer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 320px;
      height: 120px;
    }
    canvas {
      width: 320px;
      height: 120px;
      border-radius: 24px;
    }
    video {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }
  </style>
</head>
<body>
  <canvas id="notchCanvas" width="320" height="120"></canvas>
  <video id="pipVideo" autoplay muted playsinline></video>
  <script src="offscreen.js"></script>
</body>
</html>
